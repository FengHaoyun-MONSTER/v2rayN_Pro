name: build custom macOS arm64

on:
  pull_request:
    branches:
      - custom/main
    paths:
      - 'v2rayN/**'
      - 'package-osx.sh'
      - '.github/workflows/build-custom-macos-arm64.yml'
      - '.github/workflows/release-custom.yml'
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Custom version without the leading v
        required: true
        default: 7.23.4-custom.1
        type: string

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: macos-latest
    env:
      OUTPUT: ${{ github.workspace }}/v2rayN-macos-arm64
      RID: osx-arm64

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: 10.0.1xx

    - name: Resolve version
      run: |
        version="${{ inputs.version }}"
        if [[ -z "$version" ]]; then
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' v2rayN/Directory.Build.props | head -n 1)"
        fi
        [[ -n "$version" ]] || { echo "Unable to resolve application version" >&2; exit 1; }
        echo "APP_VERSION=$version" >> "$GITHUB_ENV"

    - name: Publish v2rayN
      working-directory: ./v2rayN
      run: >-
        dotnet publish ./v2rayN.Desktop/v2rayN.Desktop.csproj
        -c Release -r "$RID" -p:SelfContained=true
        -p:Version="$APP_VERSION" -o "$OUTPUT"

    - name: Publish AmazTool
      working-directory: ./v2rayN
      run: >-
        dotnet publish ./AmazTool/AmazTool.csproj
        -c Release -r "$RID" -p:SelfContained=true -p:PublishTrimmed=true
        -p:Version="$APP_VERSION" -o "$OUTPUT"

    - name: Remove debug symbols
      run: find "$OUTPUT" -type f -name '*.pdb' -delete

    - name: Install package tools
      run: brew install create-dmg p7zip

    - name: Package update ZIP and installer DMG
      run: |
        set -euo pipefail
        chmod 755 package-osx.sh
        ./package-osx.sh macos-arm64 "$OUTPUT" "$APP_VERSION"
        7z a -tZip v2rayN-macos-arm64.zip v2rayN-macos-arm64 -mx1

    - name: Verify DMG, ZIP, and ARM64 runtime
      run: |
        set -euo pipefail
        hdiutil verify v2rayN-macos-arm64.dmg
        7z l v2rayN-macos-arm64.zip | grep -q 'v2rayN-macos-arm64/bin/geosite.dat'
        7z l v2rayN-macos-arm64.zip | grep -q 'v2rayN-macos-arm64/bin/cfst/cfst'
        7z l v2rayN-macos-arm64.zip | grep -q 'v2rayN-macos-arm64/guiConfigs/default-workspace-background.gif'

        MOUNT_POINT="$(mktemp -d)"
        hdiutil attach v2rayN-macos-arm64.dmg -readonly -nobrowse -mountpoint "$MOUNT_POINT"
        trap 'hdiutil detach "$MOUNT_POINT"' EXIT

        APP="$MOUNT_POINT/v2rayN.app/Contents/MacOS"
        test -x "$APP/v2rayN"
        test -x "$APP/bin/cfst/cfst"
        test -s "$APP/bin/cfst/ip.txt"
        test -s "$APP/bin/geosite.dat"
        test -s "$APP/guiConfigs/default-workspace-background.gif"
        file "$APP/v2rayN" | grep -q 'arm64'
        file "$APP/bin/cfst/cfst" | grep -q 'arm64'
        file "$APP/bin/xray/xray" | grep -q 'arm64'
        "$APP/bin/xray/xray" version | head -n 1 | grep -q '26.7.11'
        codesign --verify --deep --strict --verbose=2 "$MOUNT_POINT/v2rayN.app"

        while IFS= read -r -d '' FILE_PATH; do
          FILE_INFO="$(file "$FILE_PATH")"
          if [[ "$FILE_INFO" == *"Mach-O"* && "$FILE_INFO" != *"arm64"* ]]; then
            echo "Non-arm64 Mach-O found in app bundle: $FILE_INFO" >&2
            exit 1
          fi
        done < <(find "$APP" -type f -print0)

    - name: Upload macOS packages
      uses: actions/upload-artifact@v7
      with:
        name: release-custom-macos-arm64
        path: |
          v2rayN-macos-arm64.zip
          v2rayN-macos-arm64.dmg
        if-no-files-found: error
        retention-days: 14
