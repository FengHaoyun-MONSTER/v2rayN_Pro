name: custom code test

on:
  pull_request:
    branches:
      - custom/main
    paths:
      - 'v2rayN/**'
      - 'package-osx.sh'
      - '.github/workflows/**'
  push:
    branches:
      - custom/main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: 10.0.1xx
    - name: Run ServiceLib tests
      run: dotnet test ./v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release
